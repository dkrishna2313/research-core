[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-core"
version = "0.1.0"
description = "Domain-neutral research library — RC1 core contracts and provider protocols"
readme = "README.md"
# Python 3.11 minimum: match-statement syntax and tomllib are stable,
# typing improvements (Self, TypeVarTuple, ParamSpec, LiteralString) are
# available without backport packages, and 3.11 remains broadly deployed.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["research_core"]
