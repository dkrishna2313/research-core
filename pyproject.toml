[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-core"
version = "0.4.0"
description = "Domain-neutral research library — RC4 evidence normalization and ranking"
readme = "README.md"
# Python 3.11 minimum: match-statement syntax and tomllib are stable,
# typing improvements (Self, TypeVarTuple, ParamSpec, LiteralString) are
# available without backport packages, and 3.11 remains broadly deployed.
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Install dc-power-agent from the knowledge-layer repo to enable KnowledgeAdapter.
# The research_core.adapters.knowledge module is importable without this extra,
# but KnowledgeAdapter.retrieve() will raise ProviderUnavailableError at runtime.
knowledge = ["dc-power-agent"]
# Install web extra to enable WebSearchAdapter (DuckDuckGo + page fetching).
# HTML extraction requires trafilatura; PDF requires pypdf; DOCX requires python-docx.
# All are optional at the module level — missing deps raise ProviderUnavailableError.
web = [
    "ddgs>=6.0",
    "requests>=2.31",
    "trafilatura>=1.6",
    "pypdf>=4.0",
    "python-docx>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "knowledge: tests for the KnowledgeAdapter and knowledge-layer integration",
    "web: tests for the WebSearchAdapter and web-provider integration",
    "integration: tests that require external resources (real knowledge_store, network)",
    "network: tests that require live network access",
    "normalization: tests for the evidence normalization and ranking pipeline",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["research_core"]

[[tool.mypy.overrides]]
# knowledge (dc-power-agent) is an optional dependency with no bundled stubs.
# Imports from it are guarded by TYPE_CHECKING or lazy runtime imports.
module = ["knowledge", "knowledge.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Web optional dependencies — no bundled stubs; imports guarded lazily.
module = [
    "ddgs", "ddgs.*",
    "duckduckgo_search", "duckduckgo_search.*",
    "trafilatura", "trafilatura.*",
    "pypdf", "pypdf.*",
    "docx", "docx.*",
]
ignore_missing_imports = true
